<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GEONEXUS | 2D Route</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root {
    --bg: #05070d;
    --panel: #0b1322;
    --text: #e6edf5;
    --muted: #9fb3c8;
    --accent: #23b5a4;
    --accent-bright: #48e5c2;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(35, 181, 164, 0.4);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 4px; color: var(--accent-bright); }
  header span { font-size: 0.8rem; color: var(--muted); }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    align-items: end;
    padding: 12px 16px;
    background: var(--panel);
  }
  .controls label { display: block; font-size: 0.7rem; letter-spacing: 1px; color: var(--accent); margin-bottom: 4px; }
  .controls select {
    width: 100%;
    padding: 9px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(35, 181, 164, 0.5);
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button {
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    background: var(--accent-bright);
    color: var(--bg);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover { filter: brightness(1.1); }
  button.danger { background: var(--danger); }
  button[hidden] { display: none; }
  #status { padding: 8px 16px; min-height: 2em; font-size: 0.9rem; color: var(--accent-bright); }
  #status.error { color: #ff9a9a; }
  #map { flex: 1; min-height: 300px; background: #0a0f1a; }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: rgba(35, 181, 164, 0.3);
    border-top: 1px solid rgba(35, 181, 164, 0.4);
  }
  .summary div { background: var(--panel); padding: 10px 14px; }
  .summary small { display: block; font-size: 0.65rem; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .summary strong { display: block; margin-top: 2px; font-size: 0.95rem; word-break: break-word; }
  .end-row { padding: 10px 16px; text-align: center; background: var(--panel); }
  .end-row button { width: 100%; max-width: 360px; padding: 14px; }
  .leaflet-tooltip.label-start { background: #16a34a; color: #fff; border: 0; font-weight: 700; }
  .leaflet-tooltip.label-end { background: #dc2626; color: #fff; border: 0; font-weight: 700; }
  #directions { background: var(--panel); border-top: 1px solid rgba(35, 181, 164, 0.4); }
  #directions[hidden] { display: none; }
  .dir-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  .dir-head strong { flex: 1; font-size: 0.85rem; letter-spacing: 1px; color: var(--accent-bright); min-width: 110px; }
  .dir-head button { padding: 8px 12px; font-size: 0.8rem; }
  .dir-head button.ghost { background: transparent; color: var(--accent-bright); border: 1px solid var(--accent); }
  .dir-head button:disabled { opacity: 0.35; cursor: default; }
  #stepList { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; }
  #stepList li {
    display: grid;
    grid-template-columns: 38px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    cursor: pointer;
  }
  #stepList li.active { background: rgba(236, 72, 153, 0.18); }
  #stepList .ico {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #ec4899; color: #fff; font-size: 1.25rem; font-weight: 700;
  }
  #stepList li.kind-start .ico { background: #22c55e; }
  #stepList li.kind-arrive .ico { background: #ef4444; }
  #stepList .txt { font-size: 0.95rem; line-height: 1.25; }
  #stepList .txt small { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
  #stepList .dst { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .stepdot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #ec4899; color: #fff; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font: 700 12px system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  .stepdot.active { background: #fff; color: #ec4899; border-color: #ec4899; transform: scale(1.25); }
  @media (max-width: 640px) {
    .controls { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <h1>GEONEXUS</h1>
    <span>Campus route</span>
  </header>

  <form class="controls" id="routeForm">
    <div>
      <label for="selStart">START</label>
      <select id="selStart"></select>
    </div>
    <div>
      <label for="selDest">DESTINATION</label>
      <select id="selDest"></select>
    </div>
    <button type="submit">Show route</button>
  </form>

  <div id="status" role="status" aria-live="polite">Loading campus data…</div>
  <div id="map"></div>

  <section id="directions" hidden aria-label="Directions">
    <div class="dir-head">
      <strong id="stepCounter">DIRECTIONS</strong>
      <button type="button" id="btnPrev" aria-label="Previous step">&#9664; Prev</button>
      <button type="button" id="btnNext" aria-label="Next step">Next &#9654;</button>
      <button type="button" class="ghost" id="btnWhole">Whole route</button>
    </div>
    <ol id="stepList"></ol>
  </section>

  <div class="summary">
    <div><small>Start</small><strong id="cardStart">–</strong></div>
    <div><small>Destination</small><strong id="cardDest">–</strong></div>
    <div><small>Walking</small><strong id="cardEta">–</strong></div>
  </div>

  <div class="end-row">
    <button class="danger" id="btnEnd" type="button" hidden>End routing</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="routing.js"></script>
<script>
(function () {
  "use strict";
  const CFG = window.GEONEXUS;
  const $ = (id) => document.getElementById(id);

  // Same property names the 3D app uses, so names match between the two pages.
  const NAME_FIELDS = ["Name", "name", "NAME", "building_name", "building:name", "title"];

  const setStatus = (msg, isError) => {
    $("status").textContent = msg || "";
    $("status").className = isError ? "error" : "";
  };

  const map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  map.setView([-25.7545, 28.2290], 16);

  const routeLayer = L.layerGroup().addTo(map);
  let network = null;
  let buildings = [];

  /* ---------- buildings ---------- */

  function nameOf(props, idx) {
    for (const f of NAME_FIELDS) {
      const v = props && props[f];
      if (v !== undefined && v !== null && v !== "") return String(v);
    }
    return "Building " + (idx + 1);
  }

  // One entry per polygon, in file order. The 3D app numbers buildings the same
  // way (building-0, building-1, ...), so ?s=3 means the same building in both.
  function parseBuildings(gj) {
    const out = [];
    const add = (rings, f) => {
      const idx = out.length;
      const outer = rings[0] || [];
      let x = 0, y = 0;
      outer.forEach((c) => { x += c[0]; y += c[1]; });
      out.push({
        id: String(idx),
        name: nameOf(f.properties, idx),
        rings,
        center: outer.length ? [x / outer.length, y / outer.length] : null
      });
    };
    ((gj && gj.features) || []).forEach((f) => {
      const g = f.geometry;
      if (!g) return;
      if (g.type === "Polygon") add(g.coordinates, f);
      else if (g.type === "MultiPolygon") g.coordinates.forEach((p) => add(p, f));
    });
    return out.filter((b) => b.center);
  }

  function findBuilding(param) {
    if (param === null || param === undefined || param === "") return null;
    const q = String(param).trim();
    return (
      buildings.find((b) => b.id === q) ||
      buildings.find((b) => b.name.toLowerCase() === q.toLowerCase()) ||
      null
    );
  }

  function fillSelect(sel, placeholder) {
    sel.replaceChildren();
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = placeholder;
    sel.appendChild(ph);
    [...buildings]
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach((b) => {
        const o = document.createElement("option");
        o.value = b.id;
        o.textContent = b.name;
        sel.appendChild(o);
      });
  }

  /* ---------- URL state ---------- */

  function setParams(s, d) {
    const url = new URL(window.location.href);
    ["s", "d"].forEach((k) => url.searchParams.delete(k));
    if (s !== null && d !== null) {
      url.searchParams.set("s", s);
      url.searchParams.set("d", d);
    }
    history.replaceState(null, "", url.toString());
  }

  /* ---------- turn-by-turn directions ---------- */

  const ICONS = {
    start: "\u25CF", straight: "\u2191", left: "\u2190", right: "\u2192",
    "slight-left": "\u2196", "slight-right": "\u2197",
    "sharp-left": "\u2199", "sharp-right": "\u2198",
    uturn: "\u21A9", arrive: "\u2691"
  };
  const dirState = { steps: [], dots: [], items: [], current: -1, bounds: null };

  function fmtDist(m) {
    if (m < 10) return Math.max(1, Math.round(m)) + " m";
    if (m < 1000) return Math.round(m / 5) * 5 + " m";
    return (m / 1000).toFixed(1) + " km";
  }

  function hideDirections() {
    $("directions").hidden = true;
    $("stepList").replaceChildren();
    dirState.steps = []; dirState.dots = []; dirState.items = []; dirState.current = -1;
  }

  function selectStep(i, zoom) {
    const st = dirState.steps[i];
    if (!st) return;
    dirState.current = i;
    dirState.items.forEach((li, k) => li.classList.toggle("active", k === i));
    dirState.dots.forEach((el, k) => { if (el) el.classList.toggle("active", k === i); });
    $("stepCounter").textContent = "STEP " + (i + 1) + " OF " + dirState.steps.length;
    $("btnPrev").disabled = i === 0;
    $("btnNext").disabled = i === dirState.steps.length - 1;
    dirState.items[i].scrollIntoView({ block: "nearest" });
    if (zoom !== false) map.flyTo([st.ll[1], st.ll[0]], Math.max(map.getZoom(), 18), { duration: 0.6 });
  }

  function renderDirections(steps, bounds) {
    hideDirections();
    if (!steps || !steps.length) return;
    dirState.steps = steps;
    dirState.bounds = bounds;

    const list = $("stepList");
    steps.forEach((st, i) => {
      const li = document.createElement("li");
      li.className = "kind-" + st.kind;
      const ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = ICONS[st.icon] || "\u2191";
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = st.text;
      if (st.sub) {
        const sub = document.createElement("small");
        sub.textContent = st.sub;
        txt.appendChild(sub);
      }
      const dst = document.createElement("span");
      dst.className = "dst";
      dst.textContent = st.dist > 0 ? fmtDist(st.dist) : "";
      li.append(ico, txt, dst);
      li.addEventListener("click", () => selectStep(i));
      list.appendChild(li);
      dirState.items.push(li);

      // numbered dot on the map for each turn
      if (st.kind === "turn" || st.kind === "continue") {
        const marker = L.marker([st.ll[1], st.ll[0]], {
          icon: L.divIcon({ className: "", html: '<div class="stepdot">' + i + "</div>", iconSize: [24, 24] }),
          keyboard: false
        }).addTo(routeLayer);
        marker.on("click", () => selectStep(i));
        dirState.dots[i] = marker.getElement() ? marker.getElement().firstChild : null;
        marker.on("add", () => { dirState.dots[i] = marker.getElement().firstChild; });
      }
    });

    $("directions").hidden = false;
    $("stepCounter").textContent = steps.length + " STEPS";
    $("btnPrev").disabled = true;
    $("btnNext").disabled = steps.length < 2;
  }

  $("btnNext").addEventListener("click", () => selectStep(Math.min(dirState.steps.length - 1, dirState.current + 1)));
  $("btnPrev").addEventListener("click", () => selectStep(Math.max(0, dirState.current - 1)));
  $("btnWhole").addEventListener("click", () => {
    if (dirState.bounds) map.fitBounds(dirState.bounds, { padding: [50, 50] });
    dirState.items.forEach((li) => li.classList.remove("active"));
    dirState.dots.forEach((el) => { if (el) el.classList.remove("active"); });
    dirState.current = -1;
    $("stepCounter").textContent = dirState.steps.length + " STEPS";
    $("btnPrev").disabled = true;
    $("btnNext").disabled = dirState.steps.length < 2;
  });

  /* ---------- route display (mirrors the 3D app: pink line, green start, red end) ---------- */

  function showRoute(start, dest) {
    routeLayer.clearLayers();
    hideDirections();
    if (start.id === dest.id) { setStatus("Please choose two different buildings.", true); return; }

    let r;
    try {
      r = network.route(start.center, dest.center);
    } catch (err) {
      setStatus(err.message, true);
      return;
    }

    const hl = (b, color) =>
      L.polygon(b.rings.map((ring) => ring.map((c) => [c[1], c[0]])), {
        color, weight: 3, fillColor: color, fillOpacity: 0.35
      }).addTo(routeLayer);
    hl(start, "#22c55e");
    hl(dest, "#ef4444");

    L.polyline(r.path, { color: "#ffffff", weight: 10, opacity: 0.95 }).addTo(routeLayer);
    const line = L.polyline(r.path, { color: "#ec4899", weight: 6 }).addTo(routeLayer);

    const dot = (b, color, cls, text) =>
      L.circleMarker([b.center[1], b.center[0]], {
        radius: 9, color: "#fff", weight: 3, fillColor: color, fillOpacity: 1
      }).bindTooltip(text, { permanent: true, direction: "top", offset: [0, -10], className: cls }).addTo(routeLayer);
    dot(start, "#22c55e", "label-start", "START: " + start.name);
    dot(dest, "#ef4444", "label-end", "END: " + dest.name);

    map.fitBounds(line.getBounds(), { padding: [50, 50] });
    renderDirections(PathRouter.buildDirections(r.track, start.name, dest.name, buildings), line.getBounds());

    const mins = Math.max(1, Math.round(r.distance / CFG.WALK_SPEED_MS / 60));
    $("cardStart").textContent = start.name;
    $("cardDest").textContent = dest.name;
    $("cardEta").textContent = "≈ " + mins + " min (" + Math.round(r.distance) + " m)";
    $("selStart").value = start.id;
    $("selDest").value = dest.id;
    $("btnEnd").hidden = false;
    setParams(start.id, dest.id);
    setStatus("Route found: " + start.name + " → " + dest.name + ".");
  }

  function endRouting() {
    routeLayer.clearLayers();
    hideDirections();
    ["cardStart", "cardDest", "cardEta"].forEach((id) => ($(id).textContent = "–"));
    $("btnEnd").hidden = true;
    $("selStart").value = "";
    $("selDest").value = "";
    setParams(null, null);
    setStatus("Routing ended. Pick a new start and destination, or scan another QR code.");
    window.close(); // only works for tabs opened by script; otherwise the page stays usable
  }

  /* ---------- load data ---------- */

  async function loadJSON(url) {
    const res = await fetch(url, { cache: "no-cache" });
    if (!res.ok) throw new Error("Could not load " + url + " (HTTP " + res.status + ")");
    return res.json();
  }

  async function init() {
    try {
      const [bGeo, pGeo] = await Promise.all([loadJSON(CFG.BUILDINGS_URL), loadJSON(CFG.PATHWAYS_URL)]);
      buildings = parseBuildings(bGeo);
      network = new PathRouter.PathNetwork(pGeo);

      // Base layers: buildings (with name tooltips) and pathways
      buildings.forEach((b) => {
        L.polygon(b.rings.map((ring) => ring.map((c) => [c[1], c[0]])), {
          color: "#475569", weight: 1, fillColor: "#FFE5B4", fillOpacity: 0.55
        }).bindTooltip(b.name, { sticky: true }).addTo(map);
      });
      L.geoJSON(pGeo, { style: { color: "#16a34a", weight: 3, opacity: 0.7 }, interactive: false }).addTo(map);

      try {
        const aoi = await loadJSON(CFG.AOI_URL);
        const layer = L.geoJSON(aoi, { style: { color: "#ef4444", weight: 3, fillOpacity: 0.05 }, interactive: false }).addTo(map);
        if (layer.getBounds().isValid()) map.fitBounds(layer.getBounds());
      } catch (e) {
        const b = L.geoJSON(pGeo).getBounds();
        if (b.isValid()) map.fitBounds(b);
      }

      fillSelect($("selStart"), "Select starting building");
      fillSelect($("selDest"), "Select destination building");
      setStatus("");
    } catch (err) {
      setStatus(err.message + ". Open this page over http(s), not as a local file.", true);
      return;
    }

    const p = new URLSearchParams(window.location.search);
    if (p.has("s") || p.has("d")) {
      const s = findBuilding(p.get("s")), d = findBuilding(p.get("d"));
      if (s && d) showRoute(s, d);
      else setStatus("This QR code refers to a building that was not found. Pick a route below.", true);
    } else {
      setStatus("Pick a start and destination, or scan a QR code from the 3D model.");
    }
  }

  $("routeForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!network) return;
    const s = findBuilding($("selStart").value), d = findBuilding($("selDest").value);
    if (!s || !d) { setStatus("Please choose both a start and a destination.", true); return; }
    showRoute(s, d);
  });
  $("btnEnd").addEventListener("click", endRouting);

  init();
})();
</script>
</body>
</html>
